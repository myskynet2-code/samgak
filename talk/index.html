<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
</head><body>
<title>대화 흐름판</title>
<style>
/* 한 화면 도구: 위 대응판(크게) / 가운데 대화 기록 / 아래 큰 버튼 두 개 */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --fg:#1d2320; --mute:#66706b; --line:#d9ddd8;
  --accent:#2f6b57; --accent-fg:#ffffff; --warn:#a4532c; --rec:#c23b2e; --rec-fg:#ffffff;
  --s1:#2f6b57; --s2:#8a4f9e; --s3:#b5651d; --s4:#2c6aa0; --s5:#7a7a2a; --s6:#a03c5a;
  --body:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816; --panel:#1d2320; --fg:#e8ece9; --mute:#9aa49f; --line:#2f3733;
  --accent:#6fbf9f; --accent-fg:#0f1412; --warn:#e39a6f; --rec:#ff6b5e; --rec-fg:#1a0d0b;
  --s1:#6fbf9f; --s2:#c39ad3; --s3:#e5a35f; --s4:#7fb3e0; --s5:#c9c96a; --s6:#e38aa5;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1d2320; --fg:#e8ece9; --mute:#9aa49f; --line:#2f3733;
  --accent:#6fbf9f; --accent-fg:#0f1412; --warn:#e39a6f; --rec:#ff6b5e; --rec-fg:#1a0d0b;
  --s1:#6fbf9f; --s2:#c39ad3; --s3:#e5a35f; --s4:#7fb3e0; --s5:#c9c96a; --s6:#e38aa5;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;gap:8px;padding:8px 0}
header h1{font-size:15px;margin:0;font-weight:700;flex:1}
.ic{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
#status{font-size:13px;color:var(--mute)}
#status.on{color:var(--rec);font-weight:700}

#advice{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
#advice .now{font-size:20px;font-weight:700;line-height:1.45}
#advice .avoid{font-size:15px;color:var(--warn);margin-top:6px}
#advice .flow{font-size:14px;color:var(--mute);margin-top:6px}
#adEmpty{color:var(--mute);font-size:15px;line-height:1.5}
#adEmpty button{margin-top:8px}
#advice details{margin-top:8px}
#advice summary{font-size:14px;color:var(--accent);cursor:pointer}
.person{border-top:1px solid var(--line);padding:8px 0;font-size:14.5px;line-height:1.5}
.person b{font-size:15px}
.person .q{color:var(--mute)}
.person .alt{color:var(--mute);font-style:italic}

#log{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.ln{padding:6px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.ln .who{font-weight:700;margin-right:6px;font-size:13px;padding:1px 6px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.ln .who.guess::after{content:" 추정";font-weight:400;opacity:.7}
#interim{color:var(--mute);font-size:17px;padding:6px 0}
.hint{color:var(--mute);font-size:14px;padding:6px 0;line-height:1.5}

#bottom{padding:8px 0 6px;display:flex;flex-direction:column;gap:8px}
#typeRow{display:flex;gap:6px}
#say{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px;border-radius:10px;border:2px solid var(--accent);background:var(--panel);color:var(--fg);resize:none}
#recMsg{font-size:13px;color:var(--warn);line-height:1.4}
.big{display:flex;gap:8px}
.big button{flex:1;border:none;border-radius:14px;padding:16px 8px;font-size:18px;font-weight:700}
#rec{background:var(--rec);color:var(--rec-fg)}
#rec.on{background:var(--panel);color:var(--rec);border:2px solid var(--rec)}
#bAna{background:var(--accent);color:var(--accent-fg)}
#bAna:disabled{opacity:.6}
.btn{border:none;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px}
.btn.main{background:var(--accent);color:var(--accent-fg)}
.btn.sub{background:transparent;border:1px solid var(--line)}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet>div{background:var(--panel);width:100%;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
.sheet h2{font-size:16px;margin:0 0 10px}
.sheet label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.sheet input,.sheet textarea,.sheet select{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.sheet textarea{min-height:70px}
.small{font-size:13px;color:var(--mute);line-height:1.5}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid currentColor;background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
</style>

<header>
  <h1>대화 흐름판</h1>
  <span id="status">대기</span>
  <button class="ic" id="bSet">설정</button>
</header>

<section id="advice">
  <div id="adEmpty">녹음 누르고 대화하다가, 필요할 때 「분석」만 누르세요. 누가 한 말인지는 분석할 때 알아서 나눕니다.
    <br><button class="btn sub" id="bDemo">예시 대화로 먼저 해 보기</button></div>
  <div id="adBody" hidden>
    <div class="now" id="adNow"></div>
    <div class="avoid" id="adAvoid"></div>
    <div class="flow" id="adFlow"></div>
    <details><summary>사람별 근거 보기</summary><div id="adPeople"></div></details>
  </div>
</section>

<div id="log"><div class="hint" id="logHint">아직 기록이 없습니다.</div><div id="lines"></div><div id="interim"></div></div>

<div id="bottom">
  <div id="recMsg" hidden></div>
  <div id="typeRow" hidden>
    <textarea id="say" rows="1" placeholder="키보드 마이크로 말하거나 직접 입력"></textarea>
    <button class="btn main" id="sayOk">넣기</button>
  </div>
  <div class="big">
    <button id="rec">● 녹음</button>
    <button id="bAna">분석</button>
  </div>
</div>

<div class="sheet" id="shLine" hidden><div>
  <h2>이 발언은 누구 말인가요?</h2>
  <p class="small" id="lnText"></p>
  <div class="pick" id="lnPick"></div>
  <div class="row"><button class="btn sub" id="lnDel">발언 지우기</button><button class="btn sub" data-close>닫기</button></div>
</div></div>

<div class="sheet" id="shSet" hidden><div>
  <h2>설정</h2>
  <label for="stNames">참석자 이름 (쉼표로, 맨 앞이 나)</label>
  <input id="stNames" placeholder="나, 철수, 영희">
  <p class="small">몰라도 됩니다. 비워 두면 「나, 상대1, 상대2」로 나눕니다.</p>
  <label for="stCtx">상황 메모</label>
  <textarea id="stCtx" placeholder="예: 두 사람 갈등 중재. 내 목표는 감정 가라앉히고 다음 만남 약속 잡기."></textarea>
  <label for="stKey">Claude 사용 키 (분석에 필요)</label>
  <input id="stKey" type="password" autocomplete="off" placeholder="sk-ant-...">
  <div class="row"><button class="btn main" id="stOk">저장</button><button class="btn sub" id="stNew">새 대화 시작</button><button class="btn sub" data-close>닫기</button></div>
  <p class="small" id="stNewMsg" hidden>한 번 더 누르면 지금 기록이 지워집니다.</p>
</div></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const COLORS=['--s1','--s2','--s3','--s4','--s5','--s6'];
const store={get(k,d){try{const v=localStorage.getItem('dhf2_'+k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem('dhf2_'+k,JSON.stringify(v))}catch(e){}}};
let S=store.get('state',null)||{lines:[],lid:1,advice:null};
let cfg=store.get('cfg',{names:'',ctx:'',key:''});
const save=()=>store.set('state',S);
let sampleFn=null;
try{if(window.claude&&window.claude.use)window.claude.use('sample').then(s=>{sampleFn=s}).catch(()=>{})}catch(e){}

function names(){const n=cfg.names.split(/[,，]/).map(x=>x.trim()).filter(Boolean);return n.length?n:['나','상대1','상대2']}
function colorOf(name){const n=names();let i=n.indexOf(name);if(i<0)i=n.length+([...name].reduce((a,c)=>a+c.charCodeAt(0),0)%3);return `var(${COLORS[i%COLORS.length]})`}

/* 기록 */
function renderLines(stick){
  const box=$('#log'),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<60;
  const w=$('#lines');w.innerHTML='';$('#logHint').hidden=S.lines.length>0;
  S.lines.forEach(l=>{
    const d=document.createElement('div');d.className='ln';
    if(l.who){const who=document.createElement('span');who.className='who'+(l.fixed?'':' guess');who.style.color=colorOf(l.who);who.textContent=l.who;d.appendChild(who)}
    const tx=document.createElement('span');tx.textContent=l.text;d.appendChild(tx);
    d.onclick=()=>openLine(l.lid);w.appendChild(d);
  });
  if(stick||atBottom)box.scrollTop=box.scrollHeight;
}
function addLine(text){text=text.trim();if(!text)return;S.lines.push({lid:S.lid++,text,t:Date.now(),who:'',fixed:false});save();renderLines()}

/* 시트 */
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.sheet').hidden=true);
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.hidden=true}));
let lineId=null;
function openLine(lid){
  lineId=lid;const l=S.lines.find(x=>x.lid===lid);$('#lnText').textContent=l.text;
  const p=$('#lnPick');p.innerHTML='';
  const list=[...new Set([...names(),...S.lines.map(x=>x.who).filter(Boolean)])];
  list.forEach(n=>{const b=document.createElement('button');b.className='chip';b.style.color=colorOf(n);b.textContent=n;
    b.onclick=()=>{l.who=n;l.fixed=true;save();renderLines();$('#shLine').hidden=true};p.appendChild(b)});
  $('#shLine').hidden=false;
}
$('#lnDel').onclick=()=>{S.lines=S.lines.filter(l=>l.lid!==lineId);save();renderLines();$('#shLine').hidden=true};

$('#bSet').onclick=()=>{$('#stNames').value=cfg.names;$('#stCtx').value=cfg.ctx;$('#stKey').value=cfg.key;$('#stNewMsg').hidden=true;$('#shSet').hidden=false};
$('#stOk').onclick=()=>{cfg={names:$('#stNames').value.trim(),ctx:$('#stCtx').value.trim(),key:$('#stKey').value.trim()};store.set('cfg',cfg);renderLines();$('#shSet').hidden=true};
let newArm=false;
$('#stNew').onclick=()=>{if(!newArm){newArm=true;$('#stNewMsg').hidden=false;setTimeout(()=>{newArm=false;$('#stNewMsg').hidden=true},3000);return}
  S={lines:[],lid:1,advice:null};save();renderLines(true);renderAdvice();newArm=false;$('#shSet').hidden=true};

/* 예시 */
$('#bDemo').onclick=()=>{
  cfg.names=cfg.names||'나, 민수, 지영';
  cfg.ctx=cfg.ctx||'(예시) 모임 일 분담 때문에 민수와 지영이 서운한 상태. 나는 중재하는 입장.';
  store.set('cfg',cfg);
  const demo=['두 분 다 오늘 시간 내 줘서 고마워요. 편하게 얘기해 봅시다.',
   '솔직히 저는 지난달부터 일이 다 저한테만 오는 것 같아서 좀 지쳤어요.',
   '그건 제가 부탁드린 적 없는데요. 민수 씨가 먼저 하겠다고 하신 거잖아요.',
   '하겠다고는 했죠. 근데 그게 계속 당연한 게 되니까 그렇죠.',
   '저도 바빠요. 저만 노는 사람처럼 말씀하시니까 좀 그렇네요.',
   '노는 사람이라고는 안 했어요. 그냥 좀 알아 달라는 거예요.'];
  S={lines:[],lid:1,advice:null};demo.forEach(addLine);renderAdvice();
};

/* 녹음: 버튼 한 번, 끊겨도 저절로 다시 */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,running=false,wake=null;
function setStatus(t,on){const s=$('#status');s.textContent=t;s.className=on?'on':''}
async function grabWake(){try{if('wakeLock' in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(running&&document.visibilityState==='visible')grabWake()});
function recBlocked(why){
  running=false;updRec();setStatus('녹음 막힘');
  const m=$('#recMsg');m.hidden=false;
  m.textContent=why==='nosr'?'이 화면은 음성 인식이 안 됩니다. 주소를 복사해서 크롬 앱을 직접 열고 붙여 넣으세요. (Claude 앱이나 삼성 인터넷 안에서는 안 됩니다)':(why==='net'?'음성 인식 서버 연결이 안 됩니다. 인터넷 연결을 확인하세요.':'마이크 허용이 안 됐습니다. 주소창 왼쪽 자물쇠 → 권한 → 마이크 허용 후 다시 눌러 주세요. ('+(why||'')+')');
  $('#typeRow').hidden=false;
}
function startRec(){
  if(!SR){recBlocked('nosr');return}
  rec=new SR();rec.lang='ko-KR';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)addLine(r[0].transcript);else interim+=r[0].transcript}
    $('#interim').textContent=interim;
    if(interim){const b=$('#log');if(b.scrollHeight-b.scrollTop-b.clientHeight<80)b.scrollTop=b.scrollHeight}};
  rec.onerror=e=>{if(e.error==='network')recBlocked('net');else if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error))recBlocked(e.error)};
  rec.onend=()=>{$('#interim').textContent='';if(running){try{rec.start()}catch(e){setTimeout(()=>{try{rec.start()}catch(_){}},300)}}};
  try{rec.start();running=true;setStatus('듣는 중',true);grabWake()}catch(e){recBlocked(String(e.name||e));return}
  updRec();
}
function stopRec(){running=false;try{rec&&rec.stop()}catch(e){}setStatus('멈춤');if(wake){wake.release().catch(()=>{});wake=null}updRec()}
function updRec(){const b=$('#rec');b.className=running?'on':'';b.textContent=running?'■ 멈춤':'● 녹음'}
$('#rec').onclick=()=>running?stopRec():startRec();

const say=$('#say');
function commitSay(){const v=say.value.trim();if(!v)return;addLine(v);say.value=''}
say.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();commitSay()}});
$('#sayOk').onclick=()=>{commitSay();say.focus()};

/* 분석 */
function buildPrompt(){
  const n=names(),me=n[0];
  const recent=S.lines.slice(-120);
  const txt=recent.map((l,i)=>`${i+1}. ${l.fixed?'['+l.who+'] ':''}${l.text}`).join('\n');
  return `너는 대화 중인 사람이 폰 화면을 힐끗 보고 대응할 수 있게 돕는 상담·중재 보조다. 사용자는 「${me}」다.
참석자 이름(알려진 것): ${n.join(', ')}
${cfg.ctx?'상황: '+cfg.ctx+'\n':''}
아래 기록은 화자 표시 없이 음성 인식으로 받아 적은 것이다(대괄호는 사용자가 직접 정한 화자). 인식 오류가 있을 수 있다.

할 일:
1. 각 줄이 누구 말인지 내용·말투·흐름으로 추정한다. 대괄호로 정해진 줄은 그대로 둔다. 판단이 안 서면 "?"로 둔다.
2. 각 사람의 심리와 의도를 실제 발언을 근거로 짧게 추정하고, 다른 해석 가능성도 하나씩 붙인다. 근거 없는 추정은 쓰지 않는다.
3. 사용자가 지금 바로 할 수 있는 말 한두 문장을 「대응」에 쓴다. 최근 흐름에 무게를 둔다.
아주 짧게, 쉬운 존댓말로, 외래어는 피한다.

아래 JSON만 출력:
{"화자":["줄마다 이름"],"대응":"","피할것":"","흐름":"","사람":[{"이름":"","근거":"","심리":"","의도":"","다른해석":""}]}
("화자" 배열 길이는 줄 수 ${recent.length}개와 같게, "사람"에는 「${me}」 제외)

기록:
${txt}`;
}
function applyResult(a){
  const recent=S.lines.slice(-120);
  if(Array.isArray(a.화자))recent.forEach((l,i)=>{if(!l.fixed&&a.화자[i])l.who=String(a.화자[i])});
  a.at=Date.now();S.advice=a;save();renderLines();renderAdvice();
}
function renderAdvice(){
  const a=S.advice;$('#adEmpty').hidden=!!a;$('#adBody').hidden=!a;if(!a)return;
  $('#adNow').textContent=a.대응||'';$('#adAvoid').textContent=a.피할것?'피할 것: '+a.피할것:'';
  $('#adFlow').textContent=a.흐름?'흐름: '+a.흐름:'';
  const p=$('#adPeople');p.innerHTML='';
  (a.사람||[]).forEach(x=>{const d=document.createElement('div');d.className='person';
    const h=document.createElement('b');h.textContent=x.이름||'';d.appendChild(h);
    [['q','근거: ',x.근거],['','심리: ',x.심리],['','의도: ',x.의도],['alt','다른 해석: ',x.다른해석]].forEach(([c,l,v])=>{if(!v)return;const e=document.createElement('div');if(c)e.className=c;e.textContent=l+v;d.appendChild(e)});
    p.appendChild(d)});
}
let busy=false;
function anaLabel(t,ms){const b=$('#bAna');b.textContent=t;if(ms)setTimeout(()=>{if(!busy)b.textContent='분석'},ms)}
async function analyze(){
  if(busy)return;commitSay();
  if(!S.lines.length){anaLabel('기록 없음',1800);return}
  if(!sampleFn&&!cfg.key){anaLabel('설정에서 키 넣기',2500);$('#bSet').click();return}
  busy=true;$('#bAna').disabled=true;anaLabel('분석 중…');
  try{
    let a;
    if(sampleFn){
      try{a=await sampleFn.json(buildPrompt(),{cache:false})}
      catch(e){
        if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)){sampleFn=null;throw new Error('허용 안 됨')}
        throw new Error(e.code==='rate_limited'?'잠시 뒤 다시':'다시 눌러 주세요');
      }
    }else{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:1500,messages:[{role:'user',content:buildPrompt()}]})});
