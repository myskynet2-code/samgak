name: 앱 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 설치 파일 만들기
        run: gradle assembleDebug --no-daemon

      - name: 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk samgak.apk

      - name: 받는 곳에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 직각삼각형 풀이판 ${{ github.run_number }}
          files: samgak.apk
          make_latest: true
