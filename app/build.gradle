plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myskynet2.samgak'
    compileSdk 34

    defaultConfig {
        applicationId 'com.myskynet2.hyunjang'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // 업데이트 때마다 같은 서명이어야 덮어 설치가 됨 (개인 설치용 서명. 플레이스토어 출시용은 따로 만듦)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
