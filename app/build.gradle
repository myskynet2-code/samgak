plugins {
    id 'com.android.application'
}

android {
    namespace 'com.myskynet2.talkflow'
    compileSdk 34

    defaultConfig {
        applicationId 'com.myskynet2.talkflow'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // 현장계산기와 같은 개인 설치용 서명 (업데이트 때 덮어 설치되도록 고정)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
