<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현장계산기</title>
<style>
/* 두 계산기와 같은 모눈종이 바탕. 큰 카드 두 장으로 고르는 첫 화면 */
:root{--bg:#f3f6f7;--grid:rgba(40,90,110,.08);--ink:#18303a;--muted:#5d7480;--box:#ffffff;--line:#c9d6dc;--blue:#1d4fa8;--green:#0f7a5c;
  --sans:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0f1a1f;--grid:rgba(140,190,210,.07);--ink:#dbe7ec;--muted:#8ea5b0;--box:#16252c;--line:#2c4049;--blue:#7fa8ff;--green:#5fd1a8;color-scheme:dark}}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-sizing:border-box}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.6rem;margin:0;letter-spacing:.02em}
.sub{margin:0 0 8px;color:var(--muted);font-size:.92rem}
a.card{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;background:var(--box);border:1.5px solid var(--line);border-radius:16px;padding:18px 16px;min-height:92px}
a.card:active{transform:scale(.99)}
a.card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{flex:none;width:64px;height:64px;border-radius:14px;display:grid;place-items:center}
.tri .ic{background:color-mix(in srgb,var(--blue) 12%,transparent)}
.ves .ic{background:color-mix(in srgb,var(--green) 12%,transparent)}
.t{font-size:1.12rem;font-weight:700;margin:0 0 4px}
.d{font-size:.86rem;color:var(--muted);margin:0;line-height:1.45}
a.card.tri{border-left:5px solid var(--blue)} a.card.ves{border-left:5px solid var(--green)}
.foot{color:var(--muted);font-size:.78rem;text-align:center;margin-top:6px}
</style>
</head>
<body>
<main class="wrap">
  <h1>현장계산기</h1>
  <p class="sub">현장에서 바로 쓰는 계산 도구 · 인터넷 없이 작동</p>

  <a class="card tri" href="triangle.html">
    <span class="ic"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M6 38 H38 L6 6 Z" fill="none" stroke="#1d4fa8" stroke-width="3" stroke-linejoin="round"/><path d="M6 31 H13 V38" fill="none" stroke="#1d4fa8" stroke-width="2"/></svg></span>
    <span><p class="t">직각삼각형 계산</p><p class="d">변·각도 중 두 개만 넣으면 나머지가 그림 위에 바로 나옵니다</p></span>
  </a>

  <a class="card ves" href="vessel.html">
    <span class="ic"><svg width="48" height="44" viewBox="0 0 48 44" aria-hidden="true"><path d="M12 18 H36 A6 9 0 0 1 36 36 H12 A6 9 0 0 1 12 18 Z" fill="none" stroke="#0f7a5c" stroke-width="3"/><path d="M24 18 V8 M24 8 a3 3 0 1 1 3 -3" fill="none" stroke="#c4512c" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="27" r="2.5" fill="#c4512c"/></svg></span>
    <span><p class="t">압력용기 무게·인양 센터</p><p class="d">지름·두께·재질과 노즐·새들을 넣으면 무게와 무게중심을 알려줍니다</p></span>
  </a>

  <p class="foot">계산값은 이론값입니다. 인양 장비는 여유율을 따로 잡으세요.</p>
</main>
</body>
</html>
